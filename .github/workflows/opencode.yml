name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Guards: no bots (the agent's own replies are comments too: that is the loop),
    # only repository owner/members/collaborators, and only the explicit command.
    if: |
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "bash": {
                  "*": "allow",
                  "sudo *": "deny",
                  "git push --force *": "deny",
                  "git push -f *": "deny",
                  "rm *": "deny",
                  "git rebase *": "deny",
                  "git reset *": "deny",
                  "brew *": "deny"
                },
                "external_directory": {
                  "*": "deny",
                  "/tmp/*": "allow"
                }
              },
              "mcp": {
                "playwright": { "enabled": false },
                "chrome-devtools": { "enabled": false }
              }
            }
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: /opencode,/oc
          share: false
