name: opencode-triage

# Disabled after the course ended (the OpenCode API key is revoked): automatic triggers are off,
# only a manual run is left. To re-enable, restore the original triggers below.
on:
  workflow_dispatch:
  # Original triggers:
  # issues:
  #   types: [opened]

jobs:
  triage:
    # No bots, and only issues from the owner/members/collaborators.
    if: |
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "bash": {
                  "*": "allow",
                  "sudo *": "deny",
                  "git push --force *": "deny",
                  "git push -f *": "deny",
                  "rm *": "deny",
                  "git rebase *": "deny",
                  "git reset *": "deny",
                  "brew *": "deny"
                },
                "external_directory": {
                  "*": "deny",
                  "/tmp/*": "allow"
                }
              },
              "mcp": {
                "playwright": { "enabled": false },
                "chrome-devtools": { "enabled": false }
              }
            }
        with:
          model: opencode/deepseek-v4.1-flash
          share: false
          prompt: |
            A new issue was just opened. Do NOT change any code. Read the issue
            and the relevant parts of the repository, then reply with one comment
            in Russian containing: 1) the probable cause, 2) the affected files
            and parts of code, 3) the proposed way to fix it, 4) acceptance
            criteria: what counts as fixed.
