name: CI

# Disabled after the course ended (the OpenCode API key is revoked): automatic triggers are off,
# only a manual run is left. To re-enable, restore the original triggers below.
on:
  workflow_dispatch:
  # Original triggers:
  # push:
  # pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Check that generated artifacts are fresh
        run: |
          npm run generate
          git add -A
          git diff --cached --exit-code
